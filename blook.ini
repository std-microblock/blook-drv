# blook-drv configuration. Apply it with:
#
#     blook-loader apply [path]      (default: blook.ini in the working directory)
#
# Everything is optional; the defaults are the conservative ones. Device settings
# are written into the driver service key and read when the driver starts, so
# re-run `apply` and restart the driver after changing them. Roles need the
# driver running and are pinned immediately.

[device]

# Let processes of the logged-on (interactive) user open \\.\BlookDrv without
# elevation. The device is the only gate: with this on, every process running as
# that user can install hooks, toggle the hide profile and scrub processes -
# including a sample that runs as the same user. Off by default.
allow_users = true

[hooks]

# Which services the hide profile may hook, as a bit mask: bit i = entry i of the
# kernel service list (0 = NtQuerySystemInformation, 1 = NtQueryInformationProcess,
# ...). 0 = install nothing.
hook_mask = 0x1ff

# Same for the win32k window services (NtUserQueryWindow, NtUserBuildHwndList, ...).
# 0 = no window hooks.
window_hook_mask = 0xffffffff

[roles]

# Processes to classify as the analyst tools (they always see the real system) and
# as the sample (the profile only lies to these). Entries are image names
# (case-insensitive, with .exe) or decimal pids, separated by commas. Names are
# resolved when `apply` runs, so start the tool/sample first if you list names.
tool = x64dbg.exe, x32dbg.exe, windbg.exe, frida.exe
target =
